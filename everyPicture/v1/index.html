<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="styles.css" rel="stylesheet">
    <title>Every Picture V1</title>
</head>
<body>
    <div id="container">
        <h1>Welcome to Itsuki's Card Game Arena</h1>

        <div class="areaBox" id="playArea"></div>
        <div class="areaBox" id="trophyArea"></div>
        <div class="areaBox" id="standArea"></div>
        <div class="areaBox" id="cardArea"></div>
        <div class="areaBox" id="keyArea"></div>
        <div class="areaBox" id="deckArea"></div>

        <img src="images/back.jpg" alt="card1" height="300px" width="200px" id="card1" class="inPlay">
        <img src="images/back.jpg" alt="card2" height="300px" width="200px" id="card2" class="flipped">
        <img src="images/back.jpg" alt="card3" height="300px" width="200px" id="card3" class="inDeck">
        <img src="images/back.jpg" alt="card4" height="300px" width="200px" id="card4" class="flipped">
        <img src="images/back.jpg" alt="card5" height="300px" width="200px" id="card5" class="flipped">
        <img src="images/back.jpg" alt="keychain" height="300px" width="200px" id="keychain" class="flipped">
        <img src="images/back.jpg" alt="trophy" height="300px" width="200px" id="trophy" class="flipped">
        <img src="images/back.jpg" alt="acrylicstand" height="300px" width="200px" id="stand" class="flipped">
    </div>
</body>
</html>
